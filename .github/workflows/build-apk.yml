name: Build and Release APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Extract Version and Release Notes
        id: meta
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION_NAME}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          # 從 Readme.md 擷取對應 ### vX.X.X 的更新紀錄區塊
          NOTES=$(awk -v ver="### ${TAG}" '
            $0 == ver { found=1; next }
            found && /^### / { exit }
            found { print }
          ' Readme.md)

          if [ -z "$NOTES" ]; then
            NOTES="版本 ${TAG} 自動建置發布"
          fi

          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk "PhotoAlbum-${{ steps.meta.outputs.tag }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "PhotoAlbum ${{ steps.meta.outputs.tag }}"
          body: ${{ steps.meta.outputs.notes }}
          files: "PhotoAlbum-${{ steps.meta.outputs.tag }}.apk"
          draft: false
          prerelease: false
