name: Build and Release APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > release.jks

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Extract Version and Release Notes
        id: meta
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          TAG="v${VERSION_NAME}-b${VERSION_CODE}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          README_FILE="README.md"
          if [ ! -f "$README_FILE" ] && [ -f "Readme.md" ]; then
            README_FILE="Readme.md"
          fi

          NOTES=""
          if [ -f "$README_FILE" ]; then
            NOTES=$(awk -v ver="### ${TAG}" '
              $0 == ver { found=1; next }
              found && /^### / { exit }
              found { print }
            ' "$README_FILE")

            if [ -z "$NOTES" ]; then
              BASE_TAG="v${VERSION_NAME}"
              NOTES=$(awk -v ver="### ${BASE_TAG}" '
                $0 == ver { found=1; next }
                found && /^### / { exit }
                found { print }
              ' "$README_FILE")
            fi
          fi

          if [ -z "$NOTES" ]; then
            NOTES="版本 ${TAG} 自動建置發布"
          fi

          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found in app/build/outputs/apk/release"
            ls -la app/build/outputs/apk/release || true
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          mv "$APK_FILE" "PhotoAlbum-${{ steps.meta.outputs.tag }}.apk"

      - name: Force Update Git Tag
        run: |
          git tag -f "${{ steps.meta.outputs.tag }}"
          git push -f origin "${{ steps.meta.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "PhotoAlbum ${{ steps.meta.outputs.tag }}"
          body: ${{ steps.meta.outputs.notes }}
          files: "PhotoAlbum-${{ steps.meta.outputs.tag }}.apk"
          draft: false
          prerelease: false
