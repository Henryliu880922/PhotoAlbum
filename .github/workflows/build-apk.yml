name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 取得最新程式碼
        uses: actions/checkout@v5

      - name: 從 build.gradle.kts 讀取版本號
        id: get_version
        run: |
          VERSION=$(grep -m 1 'versionName' app/build.gradle.kts | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 設定 JDK 17 環境
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 賦予 gradlew 執行權限
        run: chmod +x gradlew

      - name: 編譯 Debug APK
        run: ./gradlew assembleDebug

      - name: 重新命名 APK 加上版本號
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PhotoAlbum-v${{ steps.get_version.outputs.version }}.apk

      - name: 發布可安裝 APK 到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: PhotoAlbum v${{ steps.get_version.outputs.version }}
          body: 睡前建置版本 v${{ steps.get_version.outputs.version }}（點擊下方 Assets 下載安裝）。
          files: app/build/outputs/apk/debug/PhotoAlbum-v${{ steps.get_version.outputs.version }}.apk
